# ticket configuration, rendered by the gateway's add-module wizard: every
# ${...} below was filled from the core's own configuration, the generated
# secrets or the inputs given in the wizard.
service_name: ticket
trust_domain: ${TRUST_DOMAIN}
# Not "production" yet: production mode refuses file: secret references, and
# the warden references it wants need a platform token ticket cannot renew
# unattended (deploy/README.md). Every production guard is met by hand: TLS
# to the database, the event bus, the object store and the SMTP relay, TLS on
# the inbound edge and verified enrolment.
env: dev
identity:
  provider: provided
mesh_enroll:
  enabled: true
  enroll_url: ${LCM_ENROLL_URL}
  lcm_grpc: ${LCM_GRPC}
  tenant_id: ${MESH_TENANT_ID}
  token_file: /tokens/enrollment.token
  state_file: /state/svid.json
  insecure: false
authz: { source: file, path: /app/policy.yaml }
server: { grpc_addr: 0.0.0.0:9955, http_addr: 0.0.0.0:9956 }
admin: { addr: 127.0.0.1:9840 }
discovery:
  static:
    gateway: ["${GATEWAY_GRPC}"]
    auth: ["${AUTH_GRPC}"]
limits: { max_request_bytes: 67174400 }
limits_ticket: { max_request_bytes: 1048576, max_backup_bytes: 67108864, max_page_size: 100 }
db:
  dsn: postgres://ticket_app:${GEN_PASSWORD_2}@ticket-db:5432/ticket?sslmode=verify-full&sslrootcert=/tls-ca/ca.pem
  migrate_dsn: postgres://postgres:${GEN_PASSWORD_1}@ticket-db:5432/ticket?sslmode=verify-full&sslrootcert=/tls-ca/ca.pem
  max_conns: 16
# The core's event bus: the gateway reads platform:events:<tenant> there and
# fans the module's live updates out to browsers.
valkey:
  addresses: ["${VALKEY_ADDRESS}"]
  username: ticket
  password: "${VALKEY_PASSWORD}"
  allow_plaintext: false
  ca_file: /tls/valkey-ca.pem
kek: { source: env, env: TICKET_KEK }
object_store:
  endpoint: ticket-rustfs:9000
  bucket: ticket
  region: us-east-1
  use_ssl: true
  access_key: ticket
  secret_key: ${GEN_PASSWORD_3}
  presign_ttl_seconds: 300
# Off-mesh inbound mail edge: your MTA posts raw messages to
# https://<host>/inbound/mail with the relay token (README.md).
inbound:
  addr: 0.0.0.0:9957
  tls_cert_file: /edge/tls.crt
  tls_key_file: /edge/tls.key
  relay_token_ref: file:/secrets/relay.token
  max_body_bytes: 10485760
  max_attachment_bytes: 26214400
  max_parts: 100
  max_depth: 10
# Public replies and acknowledgements (no host: replies refused, acks skipped).
smtp:
  host: "${TICKET_SMTP_HOST}"
  port: ${TICKET_SMTP_PORT}
  tls: ${TICKET_SMTP_TLS}
  allow_plaintext: false
  username: "${TICKET_SMTP_USERNAME}"
  password_ref: file:/secrets/smtp.password
  mail_domain: ${TICKET_MAIL_DOMAIN}
  timeout_seconds: 30
rules: { cost_limit: 100000, eval_timeout_ms: 50, max_rules: 500 }
secrets: { warden_service: warden, refresh_seconds: 300 }
events: { enabled: true }
gateway: { service: gateway, issuer: ${GATEWAY_ISSUER} }
